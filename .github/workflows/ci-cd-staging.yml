name: CI/CD Staging

permissions:
  contents: read

# Gatilhos: toda PR e todo push contra staging ou main. Job 3 (deploy real) só
# roda em push — nunca em PR, mesmo de dentro do repositório — para que migrations
# e Edge Functions só sejam aplicadas quando o código já estiver na branch de
# destino, não a cada rodada de revisão. Ver docs/CI_CD_STAGING.md para o plano
# completo de secrets e a estratégia de isolamento Dev vs Staging.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch: {}

concurrency:
  group: ci-cd-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  security-gates:
    name: 'Security — Supply chain & secrets'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Dependências de produção
        run: npm audit --omit=dev --audit-level=high

      - name: Segredos em arquivos versionados
        run: npm run audit:secrets

      - name: Baseline de migrations
        run: npm run audit:migrations

      - name: Contrato dos gates de CI
        run: npm run test:security:ci

  # ── Job 1: Lint & Build ──────────────────────────────────────────────────
  lint-and-build:
    name: 'Job 1 — Lint & Build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  # ── Job 2: Testes Automatizados — só roda se o Job 1 passar ─────────────
  automated-tests:
    name: 'Job 2 — Testes Automatizados'
    needs: [lint-and-build]
    runs-on: ubuntu-latest
    env:
      # src/lib/supabase.ts lança erro na importação se essas variáveis não
      # existirem — valores fictícios bastam para os testes unitários (Vitest),
      # que mockam as chamadas de serviço em vez de bater num Supabase real.
      VITE_SUPABASE_URL: 'https://ci-placeholder.supabase.co'
      VITE_SUPABASE_ANON_KEY: 'ci-placeholder-anon-key'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Vitest (suíte completa)
        run: npm run test:unit:vitest

      - name: Contratos de segurança do banco
        run: npm run test:security

  # ── Job 3: Supabase Dry-Run & Deploy — só roda se o Job 2 passar, e só em
  #    push (nunca em pull_request). Usa o Environment "staging" do GitHub:
  #    configure um required reviewer nele em Settings → Environments para
  #    exigir aprovação manual antes deste job rodar, se desejado.
  supabase-dry-run-deploy:
    name: 'Job 3 — Supabase Dry-Run & Deploy'
    needs: [automated-tests, security-gates]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Baseline estático (tabelas core, prefixos duplicados, config.toml)
        run: npm run audit:migrations

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Rede de segurança extra, 100% local: sobe um Postgres descartável dentro
      # do runner e faz o replay de TODAS as migrations (009→107) do zero. Se
      # houver erro de DDL, falha aqui — antes de qualquer coisa tocar o projeto
      # de staging real. Não é o passo exigido pelo enunciado, mas é a maneira
      # mais segura de pegar um problema de migration sem nenhum risco.
      - name: Replay local completo das migrations (rede de segurança)
        run: |
          supabase start
          supabase db reset
          supabase stop

      - name: Link ao projeto de staging
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID_STAGING"
        env:
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}

      # "Dry-run": lista o diff entre migrations locais e as já aplicadas no
      # projeto de staging, sem escrever nada. `migration up` (abaixo) não tem
      # flag --dry-run própria — esta é a forma correta de pré-visualizar antes
      # dela.
      - name: Dry-run — diff de migrations local vs. staging
        run: supabase migration list --linked --debug

      # Aplica estritamente as migrations PENDENTES (009→107 incluídas) contra
      # staging. `migration up` só soma migrations novas ao histórico — nunca
      # dropa, reseta ou força sobrescrita de nada já existente. Sem --force,
      # sem db reset, sem db push de escrita.
      - name: Deploy — aplicar migrations pendentes em staging
        run: supabase migration up --linked

      - name: Deploy — Edge Functions (test-smtp-connection, dispatch-ticket-email-outbox)
        run: |
          supabase functions deploy test-smtp-connection --project-ref "$SUPABASE_PROJECT_ID_STAGING"
          supabase functions deploy dispatch-ticket-email-outbox --project-ref "$SUPABASE_PROJECT_ID_STAGING"
        env:
          SUPABASE_PROJECT_ID_STAGING: ${{ secrets.SUPABASE_PROJECT_ID_STAGING }}
