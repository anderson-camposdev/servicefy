name: CI/CD Staging

# Gatilhos: valida todo PR contra main e toda push em main; permite disparo manual.
# Nao ha job de deploy aqui de proposito — ver docs/CI_CD_STAGING.md para o porque
# e para o plano de secrets do estagio de deploy futuro.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-cd-staging-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  automated-tests:
    name: Testes Automatizados
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Vitest (componentes)
        run: npm run test:unit:vitest

      - name: Contratos de segurança do banco
        run: npm run test:security

  migration-validation:
    name: Validação de Migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Baseline estático (tabelas core, prefixos duplicados, config.toml)
        run: npm run audit:migrations

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # `supabase start` sobe um Postgres/GoTrue/PostgREST descartáveis dentro do
      # próprio runner (via Docker, já presente em ubuntu-latest). Nenhum dado real
      # é tocado — o Postgres nasce vazio e morre com o job.
      - name: Subir stack local efêmero
        run: supabase start

      # `db reset` aqui aplica TODAS as migrations (incluindo 100→107) do zero
      # contra esse Postgres descartável. Se qualquer migration tiver erro de DDL,
      # o passo falha e o PR é bloqueado — exatamente o "dry-run" pedido, só que
      # sem depender de nenhum projeto/segredo remoto.
      - name: Replay completo das migrations (dry-run local)
        run: supabase db reset

      - name: Parar stack local
        if: always()
        run: supabase stop

  # ── Estágio opcional, só roda quando o staging remoto existir e os secrets
  #    abaixo estiverem configurados no repositório. Ver docs/CI_CD_STAGING.md.
  remote-staging-dry-run:
    name: Dry-run contra Supabase Staging (opcional)
    runs-on: ubuntu-latest
    needs: [migration-validation]
    if: ${{ github.event_name == 'pull_request' && vars.STAGING_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link ao projeto de staging
        run: supabase link --project-ref "$SUPABASE_STAGING_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_STAGING_PROJECT_ID: ${{ secrets.SUPABASE_STAGING_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}

      # --dry-run: apenas mostra o que SERIA aplicado, nunca escreve no banco de
      # staging. Nenhum comando destrutivo (db reset / push sem --dry-run) roda
      # contra um projeto remoto neste workflow.
      - name: Dry-run das migrations pendentes contra staging
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
