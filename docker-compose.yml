version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: servicefy-frontend
    ports:
      - "5173:5173"
    environment:
      # Supabase credentials (adjust to your environment)
      VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-https://your-project.supabase.co}
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY:-your-anon-key}
    depends_on:
      - mailpit
    networks:
      - servicefy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

  mailpit:
    image: axllent/mailpit:v1.27
    container_name: servicefy-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - servicefy_mailpit_data:/data
    networks:
      - servicefy
    restart: unless-stopped

networks:
  servicefy:
    driver: bridge

volumes:
  servicefy_mailpit_data:
