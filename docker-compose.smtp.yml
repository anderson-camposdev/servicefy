services:
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: servicefy-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_DATABASE: /data/mailpit.db
    volumes:
      - servicefy_mailpit_data:/data

volumes:
  servicefy_mailpit_data:
