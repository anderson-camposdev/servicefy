<!-- Form -->
<form class="space-y-lg" onsubmit="event.preventDefault();">
<div class="space-y-md">
<!-- Email Field -->
<div class="space-y-base">

<div class="relative group">

<input class="w-full pl-[48px] pr-md py-md bg-surface border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary/20 focus:border-primary outline-none transition-all font-body-md text-body-md" id="email" placeholder="nome@empresa.com.br" type="email"/>

<!-- Password Field -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="password">Senha</label>

<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">lock</span>

</div>

                        Entrar

<!-- Floating Atmosphere Elements -->
<script>
        // Optional micro-interaction: Subtle parallax or element follow
        document.addEventListener('mousemove', (e) => {
            const blobs = document.querySelectorAll('.fixed.rounded-full');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            blobs.forEach((blob, index) => {
                const speed = (index + 1) * 20;
                blob.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });
    </script>
